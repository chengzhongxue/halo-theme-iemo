apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-iemo-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: switch
          name: iemo_auto_load
          label: 自动加载内容
          value: false
          help: 当页面内容满时滚动到底部自动加载内容
        - $formkit: select
          name: iemo_page_animation
          label: 页面动画
          value: ""
          options:
            - value: ""
              label: 关闭
            - value: "Left"
              label: 从左往右
            - value: "Right"
              label: 从右往左
            - value: "Top"
              label: 从上往下
            - value: "Enlarge"
              label: 放大效果
        - $formkit: group
          name: recommend_post
          label: 推荐文章
          value:
            post_show: []
            iemo_recommend_show: ""
            iemo_swiper_shownum: "more"
          children:
            - $formkit: radio
              name: iemo_recommend_show
              id: iemo_recommend_show
              label: 显示方式（显示在首页顶部）
              options:
                - label: 不显示
                  value: ""
                - label: 轮播图（最多支持10篇）
                  value: swiper
                - label: 固定卡片（最多支持3篇，移动端仅显示第一篇）
                  value: regular
            - $formkit: repeater
              name: post_show
              if: $get(iemo_recommend_show).value != ""
              label: 选择文章
              children:
                - $formkit: postSelect
                  name: post
                  label: 文章
                  value: ""
                  validation: required
            - $formkit: radio
              name: iemo_swiper_shownum
              label: 轮播图显示数量
              help: 轮播图一页显示的数量，多篇为3个，单篇为1个
              options:
                - label: 多篇
                  value: "more"
                - label: 单篇
                  value: single
        - $formkit: number
          name: iemo_copyright
          label: 版权号
          value: 2024
          help: 填写年份（数字）即可
        - $formkit: text
          name: iemo_icp
          label: ICP备案
          help: 填写ICP备案号，没有请留空
        - $formkit: text
          name: iemo_icp_gov
          label: 公网安备号
          help: 填写公网安备号，没有请留空
        - $formkit: switch
          name: iemo_upyun
          label: 又拍云联盟
          value: false          

    - group: sidebar
      label: 侧栏
      formSchema:
        - $formkit: attachment
          name: iemo_avatar_author
          label: 个人头像
          help: 个人资料的头像 
          value: https://cravatar.cn
          accepts:
            - "image/*"
        - $formkit: attachment
          name: iemo_cover_author
          label: 个人背景
          help: 显示在侧边栏
          width: "15rem"
          aspectRatio: "16/9"
          value: /themes/theme-iemo/assets/images/cover-author.jpg
          accepts:
            - "image/*"
        - $formkit: text
          name: iemo_name_author
          label: 个人名称
          help: 个人资料的名称
          value: 困困鱼
        - $formkit: textarea
          name: iemo_des_author
          label: 个人描述
          help: 个人资料的描述
          value: 这家伙很懒，什么都没写
        - $formkit: switch
          name: iemo_aside_subpage
          id: iemo_aside_subpage
          label: 侧边栏附页
          value: false
          help: 可添加内容：菜单、评论、关于
        - $formkit: switch
          if: $get(iemo_aside_subpage).value
          name: iemo_aside_comments
          id: iemo_aside_comments
          label: 侧边栏附页-评论
          value: false
          help: 开启附页最新评论
        - $formkit: number
          if: $get(iemo_aside_comments).value
          name: iemo_aside_comments_num
          label: 最大展示条数
          value: 6
          help: 显示最新评论数量（1~100），默认6条
        - $formkit: code
          name: iemo_about
          label: 侧边栏附页-关于
          height: 200px
          language: html
          help: 位于侧边栏附页，填写文本，可用于对博客或自己的介绍等
        - $formkit: array
          name: socialMedia
          label: 社交媒体
          value: [ ]
          itemLabels:
            - type: text
              label: $value.text
            - type: text
              label: $value.url
          children:
            - $formkit: select
              name: icon
              label: 图标
              value: "ti ti-link"
              help: "「内置」为主题原生图标，其余为 Tabler Icons (4000+)。"
              options:
                # ===== 内置 iconfont（保持兼容） =====
                - value: "iconfont icon-QQ"
                  label: 内置 · QQ
                - value: "iconfont icon-weixin"
                  label: 内置 · 微信
                - value: "iconfont icon-github"
                  label: 内置 · GitHub
                - value: "iconfont icon-gitee"
                  label: 内置 · Gitee
                - value: "iconfont icon-bilibili-line"
                  label: 内置 · Bilibili
                - value: "iconfont icon-Youtube-fill"
                  label: 内置 · YouTube
                - value: "iconfont icon-tuitetwitter43"
                  label: 内置 · Twitter
                - value: "iconfont icon-telegram"
                  label: 内置 · Telegram
                - value: "iconfont icon-link"
                  label: 内置 · 通用链接

                # ===== Tabler · 社交品牌 =====
                - value: "ti ti-brand-github"
                  label: Tabler · GitHub
                - value: "ti ti-brand-gitlab"
                  label: Tabler · GitLab
                - value: "ti ti-brand-bitbucket"
                  label: Tabler · Bitbucket
                - value: "ti ti-brand-wechat"
                  label: Tabler · 微信
                - value: "ti ti-brand-weibo"
                  label: Tabler · 微博
                - value: "ti ti-brand-tencent-qq"
                  label: Tabler · QQ
                - value: "ti ti-brand-douban"
                  label: Tabler · 豆瓣
                - value: "ti ti-brand-zhihu"
                  label: Tabler · 知乎
                - value: "ti ti-brand-bilibili"
                  label: Tabler · Bilibili
                - value: "ti ti-brand-youtube"
                  label: Tabler · YouTube
                - value: "ti ti-brand-twitch"
                  label: Tabler · Twitch
                - value: "ti ti-brand-tiktok"
                  label: Tabler · TikTok
                - value: "ti ti-brand-x"
                  label: Tabler · X (Twitter)
                - value: "ti ti-brand-twitter"
                  label: Tabler · Twitter（旧）
                - value: "ti ti-brand-telegram"
                  label: Tabler · Telegram
                - value: "ti ti-brand-discord"
                  label: Tabler · Discord
                - value: "ti ti-brand-slack"
                  label: Tabler · Slack
                - value: "ti ti-brand-whatsapp"
                  label: Tabler · WhatsApp
                - value: "ti ti-brand-messenger"
                  label: Tabler · Messenger
                - value: "ti ti-brand-line"
                  label: Tabler · LINE
                - value: "ti ti-brand-skype"
                  label: Tabler · Skype
                - value: "ti ti-brand-zoom"
                  label: Tabler · Zoom
                - value: "ti ti-brand-facebook"
                  label: Tabler · Facebook
                - value: "ti ti-brand-instagram"
                  label: Tabler · Instagram
                - value: "ti ti-brand-linkedin"
                  label: Tabler · LinkedIn
                - value: "ti ti-brand-pinterest"
                  label: Tabler · Pinterest
                - value: "ti ti-brand-reddit"
                  label: Tabler · Reddit
                - value: "ti ti-brand-tumblr"
                  label: Tabler · Tumblr
                - value: "ti ti-brand-snapchat"
                  label: Tabler · Snapchat
                - value: "ti ti-brand-mastodon"
                  label: Tabler · Mastodon
                - value: "ti ti-brand-threads"
                  label: Tabler · Threads
                - value: "ti ti-brand-bluesky"
                  label: Tabler · Bluesky

                # ===== Tabler · 媒体 / 工具 =====
                - value: "ti ti-brand-spotify"
                  label: Tabler · Spotify
                - value: "ti ti-brand-apple"
                  label: Tabler · Apple
                - value: "ti ti-brand-google"
                  label: Tabler · Google
                - value: "ti ti-brand-google-drive"
                  label: Tabler · Google Drive
                - value: "ti ti-brand-dropbox"
                  label: Tabler · Dropbox
                - value: "ti ti-brand-notion"
                  label: Tabler · Notion
                - value: "ti ti-brand-figma"
                  label: Tabler · Figma
                - value: "ti ti-brand-codepen"
                  label: Tabler · CodePen
                - value: "ti ti-brand-codesandbox"
                  label: Tabler · CodeSandbox
                - value: "ti ti-brand-stackoverflow"
                  label: Tabler · Stack Overflow
                - value: "ti ti-brand-medium"
                  label: Tabler · Medium
                - value: "ti ti-brand-juejin"
                  label: Tabler · 掘金
                - value: "ti ti-brand-steam"
                  label: Tabler · Steam
                - value: "ti ti-brand-twitch"
                  label: Tabler · Twitch

                # ===== 通用联系方式 =====
                - value: "ti ti-mail"
                  label: Tabler · 邮件
                - value: "ti ti-phone"
                  label: Tabler · 电话
                - value: "ti ti-rss"
                  label: Tabler · RSS
                - value: "ti ti-link"
                  label: Tabler · 通用链接
                - value: "ti ti-world"
                  label: Tabler · 网站
                - value: "ti ti-message-circle"
                  label: Tabler · 留言
                - value: "ti ti-map-pin"
                  label: Tabler · 位置
            - $formkit: text
              name: name
              label: 名称
            - $formkit: url
              name: url
              label: 链接

    - group: post
      label: 文章
      formSchema:
        - $formkit: attachment
          name: iemo_cover_post
          label: 文章默认封面
          width: "15rem"
          aspectRatio: "16/9"
          value: /themes/theme-iemo/assets/images/random/cover-post-1.jpg
          accepts:
            - "image/*"
        - $formkit: switch
          name: iemo_toc
          label: 文章目录Toc
          value: true
    - group: moment
      label: 瞬间
      formSchema:
        - $formkit: attachment
          name: iemo_cover_moment
          label: 封面
          width: "15rem"
          aspectRatio: "16/9"
          value: /themes/theme-iemo/assets/images/random/cover-post-1.jpg
          accepts:
            - "image/*"
            -
    - group: plugin
      label: 插件适配
      formSchema:
        - $formkit: group
          name: links
          label: 链接插件
          value:
            enable_comment: false
          children:
            - $formkit: switch
              name: enable_comment
              label: 启用评论
              help: "启用链接插件原生适配的评论组件，需要链接插件 >= 1.4.0 版本"
            - $formkit: code
              label: 页面内容
              language: html
              height: 400px
              name: content
              help: 页面底部内容，可以用于填写申请信息，支持 HTML
        
    
